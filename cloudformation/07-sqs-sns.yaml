AWSTemplateFormatVersion: '2010-09-09'
Description: HireSphere SQS Queues and SNS Topics for async event processing

Parameters:
  ProjectName:
    Type: String
  Environment:
    Type: String

Resources:
  # ─── Dead Letter Queue ────────────────────────────────────────────────────────
  EventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${Environment}-events-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600  # 14 days
      KmsMasterKeyId: alias/aws/sqs
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ─── Main Events Queue (FIFO for ordering) ────────────────────────────────────
  EventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${Environment}-events.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400  # 1 day
      KmsMasterKeyId: alias/aws/sqs
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventsDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ─── Notification Queue (standard, no ordering needed) ────────────────────────
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${Environment}-notifications
      VisibilityTimeout: 60
      MessageRetentionPeriod: 3600
      KmsMasterKeyId: alias/aws/sqs
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ─── SNS Topic for fan-out ───────────────────────────────────────────────────
  EventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-${Environment}-events
      DisplayName: HireSphere Events
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Subscribe notification queue to events topic
  TopicToNotificationQueue:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref EventsTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationQueue.Arn

  # Allow SNS to write to SQS
  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotificationQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref EventsTopic

Outputs:
  EventsQueueUrl:
    Value: !Ref EventsQueue
  EventsQueueArn:
    Value: !GetAtt EventsQueue.Arn
  NotificationQueueUrl:
    Value: !Ref NotificationQueue
  EventsTopicArn:
    Value: !Ref EventsTopic
