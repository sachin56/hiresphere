AWSTemplateFormatVersion: '2010-09-09'
Description: HireSphere Cognito User Pool for authentication

Parameters:
  ProjectName:
    Type: String
  Environment:
    Type: String
  CallbackURL:
    Type: String
  AdminEmail:
    Type: String

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${ProjectName}-${Environment}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: !Ref Environment

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${ProjectName}-${Environment}-client
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      CallbackURLs:
        - !Ref CallbackURL
        - http://localhost:8000/auth/callback
      LogoutURLs:
        - !Sub https://${ProjectName}.auth.us-east-1.amazoncognito.com/logout
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [email, openid, profile]
      AllowedOAuthFlowsUserPoolClient: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${ProjectName}-${Environment}-auth
      UserPoolId: !Ref UserPool

  CandidateGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: candidates
      UserPoolId: !Ref UserPool
      Description: Candidate users

  InterviewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: interviewers
      UserPoolId: !Ref UserPool
      Description: Interviewer users

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub ${ProjectName}-CognitoUserPoolId
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub ${ProjectName}-CognitoUserPoolArn
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub ${ProjectName}-CognitoClientId
  UserPoolDomain:
    Value: !Sub ${ProjectName}-${Environment}-auth.auth.us-east-1.amazoncognito.com
