apiVersion: v1
kind: Secret
metadata:
  name: hiresphere-secrets
  namespace: hiresphere
  annotations:
    # This file is a TEMPLATE only — never commit real values to git.
    # Populate from AWS Secrets Manager via external-secrets-operator,
    # or apply manually: kubectl apply -f secrets-populated.yaml
type: Opaque
stringData:
  # Application key (php artisan key:generate)
  APP_KEY: "base64:REPLACE_WITH_GENERATED_KEY"

  # Database
  DB_PASSWORD: "REPLACE_WITH_RDS_PASSWORD"

  # AWS credentials (prefer IRSA — leave blank if using pod identity)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

  # Cognito
  COGNITO_CLIENT_SECRET: "REPLACE_WITH_COGNITO_CLIENT_SECRET"

  # Stripe
  STRIPE_SECRET_KEY: "sk_live_REPLACE"
  STRIPE_WEBHOOK_SECRET: "whsec_REPLACE"

  # Daily.co WebRTC
  DAILY_API_KEY: "REPLACE_WITH_DAILY_API_KEY"

  # SES SMTP (optional — only if using SMTP driver instead of SES SDK)
  MAIL_PASSWORD: ""
---
