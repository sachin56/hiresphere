apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiresphere-api
  namespace: hiresphere
  labels:
    app: hiresphere
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hiresphere
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hiresphere
        component: api
    spec:
      serviceAccountName: hiresphere-sa
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/hiresphere/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: hiresphere-config
            - secretRef:
                name: hiresphere-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values: [api]
                topologyKey: kubernetes.io/hostname
