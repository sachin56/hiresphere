apiVersion: v1
kind: Service
metadata:
  name: hiresphere-api
  namespace: hiresphere
  labels:
    app: hiresphere
    component: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
spec:
  selector:
    app: hiresphere
    component: api
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
